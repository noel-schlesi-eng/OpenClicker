name: Debug-APK bauen

on:
  push:
    branches: [ main, master, nfc-manager ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unit-Tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Debug-APK bauen
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NfcManager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: APK als Release-Datei veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NfcManager-debug.apk
          gh release delete nfc-manager-debug --yes --cleanup-tag || true
          gh release create nfc-manager-debug NfcManager-debug.apk --title "NFC-Manager Debug-APK" --notes "Automatisch gebaut aus Branch nfc-manager." --target "$GITHUB_SHA"
