name: Build APK

on:
  push:
    branches: [ "ccr-5d1f0d6f-btl7z6" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMAN=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | head -1)
          yes | "$SDKMAN/sdkmanager" --licenses > /dev/null || true
          "$SDKMAN/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: OpenClicker-Sim-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
