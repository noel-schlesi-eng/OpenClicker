plugins {
    id 'com.android.application'
}

android {
    namespace 'de.openclicker.sim'
    compileSdk 34

    defaultConfig {
        applicationId 'de.openclicker.sim'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Fixed debug key so every CI build has the same signature and can update installed copies
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebug'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
